# Full stack locally:  docker compose up --build
#   app → http://localhost:5173 (nginx serves the UI and proxies /api to the API)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://taskflow:taskflow@db:5432/taskflow
      # Plain HTTP on localhost; set to true (the production default) behind HTTPS.
      COOKIE_SECURE: "false"
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./web
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
