# Render Blueprint — deploys the database, API and static frontend in one step.
# Dashboard → New → Blueprint → pick this repo. Check render.com/pricing for current plans.
databases:
  - name: taskflow-db
    databaseName: taskflow
    user: taskflow

services:
  - type: web
    name: taskflow-api
    runtime: docker
    rootDir: api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: taskflow-db, property: connectionString }
      - key: CORS_ORIGIN
        sync: false   # set to your frontend URL after the first deploy

  - type: web
    name: taskflow-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # set to the API URL, e.g. https://taskflow-api.onrender.com
